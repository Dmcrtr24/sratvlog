<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRAT LOG GENERATOR 💩</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

    :root {
        --bg: #0a0a0a;
        --green: #00ff41;
        --red: #ff3131;
        --yellow: #ffd700;
        --dim: #003b00;
        --panel: #0d1a0d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: var(--bg);
        color: var(--green);
        font-family: 'Share Tech Mono', monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 20px;
        overflow-x: hidden;
    }

    /* CRT scanlines */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            rgba(0,0,0,0.08) 2px,
            rgba(0,0,0,0.08) 4px
        );
        pointer-events: none;
        z-index: 999;
    }

    h1 {
        font-family: 'VT323', monospace;
        font-size: clamp(2rem, 6vw, 4rem);
        color: var(--green);
        text-shadow: 0 0 10px var(--green), 0 0 30px rgba(0,255,65,0.4);
        letter-spacing: 4px;
        margin-bottom: 16px;
        animation: flicker 6s infinite;
    }

    @keyframes flicker {
        0%, 95%, 100% { opacity: 1; }
        96% { opacity: 0.7; }
        97% { opacity: 1; }
        98% { opacity: 0.5; }
        99% { opacity: 1; }
    }

    .controls {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }

    #btn {
        font-family: 'VT323', monospace;
        font-size: 1.4rem;
        letter-spacing: 2px;
        background: transparent;
        color: var(--green);
        border: 2px solid var(--green);
        padding: 8px 24px;
        cursor: pointer;
        text-shadow: 0 0 8px var(--green);
        box-shadow: 0 0 10px rgba(0,255,65,0.3), inset 0 0 10px rgba(0,255,65,0.05);
        transition: all 0.15s;
        position: relative;
        overflow: hidden;
    }

    #btn:hover {
        background: rgba(0,255,65,0.12);
        box-shadow: 0 0 20px rgba(0,255,65,0.6), inset 0 0 20px rgba(0,255,65,0.1);
    }

    #btn.active {
        border-color: var(--red);
        color: var(--red);
        text-shadow: 0 0 8px var(--red);
        box-shadow: 0 0 10px rgba(255,49,49,0.3), inset 0 0 10px rgba(255,49,49,0.05);
        animation: pulse-red 1.5s infinite;
    }

    @keyframes pulse-red {
        0%, 100% { box-shadow: 0 0 10px rgba(255,49,49,0.3); }
        50% { box-shadow: 0 0 25px rgba(255,49,49,0.7); }
    }

    .speed-label {
        color: #448844;
        font-size: 0.85rem;
    }

    #ms {
        background: var(--panel);
        color: var(--green);
        border: 1px solid #224422;
        font-family: 'Share Tech Mono', monospace;
        font-size: 1rem;
        width: 70px;
        padding: 6px 8px;
        text-align: center;
    }

    #ms:focus { outline: 1px solid var(--green); }

    .stats {
        display: flex;
        gap: 20px;
        margin-bottom: 12px;
        font-size: 0.8rem;
        color: #448844;
    }

    .stats span { color: var(--green); }

    #logs {
        flex: 1;
        height: 70vh;
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid #1a3a1a;
        padding: 12px;
        box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 0 15px rgba(0,255,65,0.05);
    }

    #logs::-webkit-scrollbar { width: 6px; }
    #logs::-webkit-scrollbar-track { background: #050f05; }
    #logs::-webkit-scrollbar-thumb { background: #1a5a1a; }

    .log-line {
        padding: 2px 0;
        line-height: 1.5;
        font-size: 0.88rem;
        opacity: 0;
        animation: appear 0.15s forwards;
        white-space: pre-wrap;
        word-break: break-all;
    }

    @keyframes appear {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .log-line.err {
        color: var(--red);
        text-shadow: 0 0 6px rgba(255,49,49,0.4);
    }

    .log-line .ts { color: #447744; }
    .log-line .lvl-info { color: var(--green); }
    .log-line .lvl-err { color: var(--red); font-weight: bold; }
    .log-line .msg { color: #ccffcc; }
    .log-line.err .msg { color: #ffaaaa; }

    .empty-hint {
        color: #224422;
        text-align: center;
        margin-top: 40px;
        font-family: 'VT323', monospace;
        font-size: 1.5rem;
        letter-spacing: 3px;
    }

    .counter {
        margin-top: 8px;
        font-size: 0.75rem;
        color: #335533;
        text-align: right;
    }
</style>
</head>
<body>

<h1>💩 SRAT LOG GENERATOR</h1>

<div class="controls">
    <button id="btn" onclick="toggle()">▶ НАЧАТЬ СРАТЬ</button>
    <span class="speed-label">интервал мс:</span>
    <input type="number" id="ms" value="200" min="50" max="5000">
</div>

<div class="stats">
    всего: <span id="cnt-total">0</span>
    &nbsp;|&nbsp;
    ошибок: <span id="cnt-err">0</span>
    &nbsp;|&nbsp;
    статус: <span id="status">ПРОСТАИВАЕТ</span>
</div>

<div id="logs">
    <div class="empty-hint" id="hint">[ НАЖМИ КНОПКУ ]</div>
</div>

<div class="counter" id="counter"></div>

<script>
let ev = null
let active = false
let total = 0
let errors = 0
const MAX_LINES = 200

const box = document.getElementById('logs')
const btn = document.getElementById('btn')
const cntTotal = document.getElementById('cnt-total')
const cntErr = document.getElementById('cnt-err')
const statusEl = document.getElementById('status')

function toggle() {
    if (active) {
        ev.close()
        ev = null
        btn.textContent = '▶ НАЧАТЬ СРАТЬ'
        btn.classList.remove('active')
        statusEl.textContent = 'ОСТАНОВЛЕН'
        active = false
        return
    }

    const hint = document.getElementById('hint')
    if (hint) hint.remove()

    const spd = document.getElementById('ms').value
    ev = new EventSource('/sratlogami?speed=' + spd)

    ev.onopen = () => {
        statusEl.textContent = 'СРЁТ...'
    }

    ev.onmessage = (e) => {
        // decodeURIComponent фиксит кракозябры
        const d = JSON.parse(decodeURIComponent(e.data))

        total++
        if (d.level === 'ERROR') errors++

        cntTotal.textContent = total
        cntErr.textContent = errors

        const line = document.createElement('div')
        line.className = 'log-line' + (d.level === 'ERROR' ? ' err' : '')

        const ts = d.time.split('T')[1].slice(0, 12)
        line.innerHTML =
            `<span class="ts">${ts}</span> ` +
            `<span class="${d.level === 'ERROR' ? 'lvl-err' : 'lvl-info'}">${d.level.padEnd(5)}</span> ` +
            `<span class="msg">${escHtml(d.message)}</span>`

        box.appendChild(line)
        box.scrollTop = box.scrollHeight

        if (box.childElementCount > MAX_LINES) {
            box.removeChild(box.firstChild)
        }
    }

    ev.onerror = () => {
        statusEl.textContent = '⚠ РАЗРЫВ СОЕДИНЕНИЯ'
    }

    btn.textContent = '■ ХВАТИТ СРАТЬ'
    btn.classList.add('active')
    statusEl.textContent = 'ПОДКЛЮЧЕНИЕ...'
    active = true
}

function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}
</script>

</body>
</html>
